services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: backend_test
      MYSQL_USER: backend_test
      MYSQL_PASSWORD: test-password
      MYSQL_ROOT_PASSWORD: test-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u backend_test -p$$MYSQL_PASSWORD backend_test -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
