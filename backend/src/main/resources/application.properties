spring.application.name=backend

# Local server
server.address=127.0.0.1
server.port=8080

# Validation debug messages can include rejected passwords.
logging.level.org.springframework.web=INFO

# MySQL (local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/homecare_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_MODEL}
spring.ai.openai.embedding.model=text-embedding-3-small
homecare.knowledge.vector.enabled=${HOMECARE_KNOWLEDGE_VECTOR_ENABLED:true}
homecare.knowledge.vector.cache-dir=${HOMECARE_KNOWLEDGE_CACHE_DIR:.homecare-cache/manufacturer}
spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1

# Health check
management.endpoints.web.exposure.include=health

# Single Agent -> request-scoped MCP client -> FastMCP -> authenticated tool API
homecare.agent.enabled=${HOMECARE_AGENT_ENABLED:true}
homecare.mcp.url=${HOMECARE_MCP_URL:http://127.0.0.1:8000}
# One customer question: tool calls (model + server policy), calls per tool, per-call and total time
homecare.agent.max-tool-calls=5
homecare.agent.max-calls-per-tool=2
homecare.agent.tool-timeout=5s
homecare.agent.total-timeout=20s

# Per-user consultation limit (POST /api/chat); Nginx adds a per-IP limit in front
homecare.rate-limit.chat.per-minute=5
homecare.rate-limit.chat.burst=3
homecare.rate-limit.chat.per-day=100

# chat_tool_calls retention (daily purge at 03:30 Asia/Seoul)
homecare.tool-calls.retention-days=90
