spring.application.name=backend

# Local server
server.address=127.0.0.1
server.port=8080

# Validation debug messages can include rejected passwords.
logging.level.org.springframework.web=INFO

# MySQL (local development)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/project_db
spring.datasource.username=spring
spring.datasource.password=spring1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_MODEL}
spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1

# Health check
management.endpoints.web.exposure.include=health
