# 릴리스에 이 파일이 있으면 deploy-service.sh에서 compose.prod.yaml과 병합
# ops/sql의 V001~V004 스키마와 ECR MCP 이미지 필요
# MCP 릴리스는 Agent를 활성화한다. MCP 없는 이전 릴리스는 prod 기본값 false를 유지한다.
services:
  backend:
    environment:
      HOMECARE_AGENT_ENABLED: "true"
      HOMECARE_MCP_URL: http://mcp:8000
    depends_on:
      mcp:
        condition: service_healthy
  mcp:
    image: ${MCP_IMAGE:?Set MCP_IMAGE to the verified MCP image digest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    # 내부 네트워크 전용 구성(외부 포트·Nginx 경로 제외)
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      HOMECARE_MCP_TRANSPORT: http
      HOMECARE_MCP_HOST: 0.0.0.0
      HOMECARE_MCP_ALLOWED_HOSTS: mcp
      HOMECARE_BACKEND_URL: http://backend:8080
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /homecare/prod/mcp
        awslogs-stream: ${RELEASE_ID:?Set RELEASE_ID}/mcp
        mode: non-blocking
        max-buffer-size: 4m
        cache-max-size: 10m
        cache-max-file: "3"
