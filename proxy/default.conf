log_format homecare '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

map $http_origin $cors_origin {
    default "";
    "https://homecare-omega-eight.vercel.app" "https://homecare-omega-eight.vercel.app";
}

map $http_origin $cors_denied {
    default 1;
    "" 0;
    "https://homecare-omega-eight.vercel.app" 0;
}

map "$request_method:$http_access_control_request_method" $invalid_preflight {
    default 0;
    ~^OPTIONS:(GET|POST|PUT|DELETE)$ 0;
    ~^OPTIONS: 1;
}

upstream homecare_backend {
    zone homecare_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name 43.202.80.116;
    server_tokens off;
    proxy_set_header Host $host;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /internal-health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://homecare_backend/actuator/health;
        access_log off;
    }

    location / {
        return 308 https://43.202.80.116$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 43.202.80.116;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/homecare-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homecare-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /dev/stdout homecare;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 110s;
    proxy_send_timeout 110s;

    location /api/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Vary Origin always;

        if ($cors_denied) { return 403; }
        if ($invalid_preflight) { return 403; }
        if ($request_method = OPTIONS) { return 204; }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_pass http://homecare_backend;
    }

    location = /actuator/health {
        proxy_pass http://homecare_backend;
        access_log off;
    }

    location / {
        return 404;
    }
}
