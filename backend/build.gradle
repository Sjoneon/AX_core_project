plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-vector-store'
	implementation 'org.springframework.ai:spring-ai-mcp'
	implementation 'io.github.cdimascio:dotenv-java:3.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'mysql-schema'
		excludeTags 'real-agent'
	}
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.register('mysqlTest', Test) {
	description = 'Runs the API tests against the disposable MySQL 8.4 database.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		excludeTags 'mysql-schema'
		excludeTags 'real-agent'
	}
	systemProperty 'test.datasource.url', 'jdbc:mysql://127.0.0.1:3307/backend_test'
	systemProperty 'test.datasource.driver-class-name', 'com.mysql.cj.jdbc.Driver'
	systemProperty 'test.datasource.username', 'backend_test'
	systemProperty 'test.datasource.password', 'test-password'
	exclude '**/DatabaseMigrationTests.class'
	outputs.upToDateWhen { false }
}

tasks.register('mysqlSchemaTest', Test) {
	description = 'Applies ops/rds/sql V001..V005 and backend V006 to disposable MySQL and starts the app with ddl-auto=validate.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'mysql-schema'
	}
	systemProperty 'test.datasource.url', 'jdbc:mysql://127.0.0.1:3307/backend_test'
	systemProperty 'test.datasource.username', 'backend_test'
	systemProperty 'test.datasource.password', 'test-password'
	outputs.upToDateWhen { false }
}

tasks.register('migrateDatabase', JavaExec) {
	description = 'Applies versioned SQL using MIGRATION_JDBC_URL, MIGRATION_USERNAME and MIGRATION_PASSWORD.'
	group = 'application'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.project.backend.migration.DatabaseMigration'
}

tasks.register('evaluateManufacturerRetrieval', JavaExec) {
    description = 'Builds/loads manufacturer embeddings and evaluates predefined cases; no DB or chat model.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.project.backend.mcp.retrieval.KnowledgeRetrievalEvaluation'
}

tasks.register('evaluateMessageInterpretation', JavaExec) {
    description = 'Evaluates predefined synthetic messages with the configured chat model; no DB or server.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.project.backend.mcp.consultation.MessageInterpretationEvaluation'
}

tasks.register('evaluateGroundedAnswer', JavaExec) {
    description = 'Evaluates grounded answer generation using synthetic canonical facts and the configured model.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.project.backend.mcp.agent.GroundedAnswerEvaluation'
}

tasks.register('evaluateConsultationAgent', Test) {
    description = 'Runs frozen synthetic HTTP/JWT/FastMCP consultations with the configured real model in isolated H2.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'real-agent' }
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.register('migrationTest', Test) {
	description = 'Verifies SQL upgrades, data preservation and failed migrations on disposable MySQL.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/DatabaseMigrationTests.class'
	systemProperty 'migration.integration', 'true'
	outputs.upToDateWhen { false }
}

tasks.named('mysqlTest') {
	mustRunAfter tasks.named('migrationTest')
}

tasks.named('processResources') {
	from('../ops/rds/sql') {
		into 'db/migration'
	}
	from('rag-test-data/manuals') {
		into 'rag/manuals'
	}
}
