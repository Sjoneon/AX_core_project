name: Homecare CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active production deployment running when a newer commit arrives.
concurrency:
  group: homecare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and JAR
        working-directory: backend
        run: ./gradlew --no-daemon test bootJar
      - name: Disposable MySQL integration tests
        working-directory: backend
        run: |
          docker compose -p homecare-ci -f compose.mysql-test.yaml up -d --wait --wait-timeout 180
          ./gradlew --no-daemon migrationTest mysqlTest
      - name: Remove test database
        if: always()
        working-directory: backend
        run: docker compose -p homecare-ci -f compose.mysql-test.yaml down -v
      - name: Frontend lint and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://43.202.80.116
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Deployment scripts and Docker images
        run: |
          python3 -m unittest discover -s ops/tests -v
          for script in ops/*.sh; do bash -n "$script"; done
          docker build --platform linux/amd64 -t homecare-backend:ci backend
          docker build --platform linux/amd64 -t homecare-nginx:ci proxy
          python3 ops/test-proxy.py --image homecare-nginx:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jar
          path: backend/build/libs/app.jar
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://43.202.80.116/actuator/health
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Download only this run's tested JAR, never an artifact from a PR run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: backend/build/libs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: homecare-${{ github.run_id }}
          allowed-account-ids: '528215464049'
          unset-current-credentials: true
      - name: Publish immutable images and deploy through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          ECR_NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
        run: python3 ops/ci-release.py
