log_format homecare '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

upstream homecare_backend {
    zone homecare_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /dev/stdout homecare;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 110s;
    proxy_send_timeout 110s;

    location /api/ {
        proxy_pass http://homecare_backend;
    }

    location = /actuator/health {
        proxy_pass http://homecare_backend;
        access_log off;
    }

    location / {
        return 404;
    }
}
