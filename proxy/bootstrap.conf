log_format homecare '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

upstream homecare_backend {
    zone homecare_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name 43.202.80.116;
    server_tokens off;
    proxy_set_header Host $host;
    access_log /dev/stdout homecare;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api/ {
        proxy_buffering off;
        proxy_pass http://homecare_backend;
    }

    location = /actuator/health {
        proxy_pass http://homecare_backend;
        access_log off;
    }

    location / {
        return 404;
    }
}
